behaviors:
  Seeker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4176
      learning_rate: 5.0e-5 # lower learning rate
      beta: 8.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 256
        sequence_length: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:              # helps explore around obstacles
        gamma: 0.99
        strength: 0.02
        encoding_size: 64
        learning_rate: 3.0e-4
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000